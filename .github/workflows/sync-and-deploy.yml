# Sincroniza os repositórios do GitHub com o portfólio e publica no GitHub Pages.
#
# Dispara:
#   - a cada push na branch main
#   - a cada 6 horas (cron) → pega repositórios novos automaticamente
#   - manualmente (Actions → Run workflow)
#   - via repository_dispatch "new-project" (use templates/notify-portfolio.yml nos outros repositórios
#     para o neurônio nascer segundos depois do push)
name: Sync projects & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [new-project]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sincronizar repositórios do GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Opcional: PAT com escopo "repo" para incluir repositórios privados.
          PORTFOLIO_TOKEN: ${{ secrets.PORTFOLIO_TOKEN }}
        run: npm run sync

      - name: Commitar projects.json (se mudou)
        run: |
          if ! git diff --quiet -- public/data/projects.json; then
            git config user.name "portfolio-bot"
            git config user.email "actions@users.noreply.github.com"
            git add public/data/projects.json
            git commit -m "chore: sincroniza projetos do GitHub [skip ci]"
            git push
          else
            echo "projects.json sem alterações"
          fi

      - name: Build
        env:
          # raphaelnugas.github.io → "/", qualquer outro repositório → "/<nome-do-repo>/"
          VITE_BASE: ${{ (endsWith(github.repository, '.github.io') && '/') || format('/{0}/', github.event.repository.name) }}
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true  # habilita o Pages automaticamente na primeira execução
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
